name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    # Evita re-disparos por ediciones hechas por bots (p.ej. este mismo workflow comentando)
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
          prompt: |
            Estás analizando el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            Título: ${{ github.event.issue.title }}
            Cuerpo:
            ${{ github.event.issue.body }}

            Pasos a seguir:
            1. Ejecuta `gh label list` para ver las labels existentes en el repo.
            2. Analiza el título y el cuerpo del issue y decide qué labels existentes aplican
               (por ejemplo: bug, enhancement, documentation, question, good first issue,
               help wanted, duplicate, invalid, wontfix). Usa solo labels que ya existan en
               el repo, no crees labels nuevas. Puedes aplicar más de una si corresponde.
               Si el issue no tiene suficiente información para ninguna label, no apliques
               ninguna.
            3. Aplica las labels elegidas con `gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"`.
               No quites labels que ya estén puestas manualmente por una persona, salvo que
               sean claramente incorrectas dado el contenido actual del issue.
            4. Publica UN comentario en el issue (`gh issue comment ${{ github.event.issue.number }} --body "..."`)
               con un diagnóstico general del problema, en español, que sirva como punto de
               partida para implementar la solución después. El comentario debe incluir:
               - Un resumen breve de lo que se está reportando/pidiendo.
               - Una hipótesis de causa raíz (si es un bug) o del alcance (si es una feature).
               - Qué archivos o áreas del código probablemente estén involucrados (explora el
                 repo si hace falta).
               - Sugerencias de próximos pasos para implementar la solución, sin escribir el
                 código todavía — esto es solo diagnóstico.
               Firma el comentario indicando que fue generado automáticamente por Claude.
            5. No hagas cambios de código ni abras PRs en este workflow, solo labels y el
               comentario de diagnóstico.
