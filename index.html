<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar entre modo oscuro y claro">
        <input type="checkbox" id="theme-toggle" role="switch" aria-checked="false" aria-label="Alternar modo claro/oscuro">
        <span class="slider"></span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section leaderboard-section">
          <span class="label">RÉCORDS</span>
          <ol class="leaderboard-list" id="leaderboard-list"></ol>
          <div class="stats-row">
            <span class="label">MEJOR COMBO</span>
            <span class="value stats-value" id="best-combo">0</span>
          </div>
          <div class="stats-row">
            <span class="label">MÁS LÍNEAS</span>
            <span class="value stats-value" id="best-lines">0</span>
          </div>
          <button id="reset-records-btn" class="leaderboard-reset-btn">Reset records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-extra" class="hidden">
          <input type="text" id="name-input" class="leaderboard-name-input" placeholder="Tu nombre" maxlength="12" />
          <button id="submit-score-btn" class="leaderboard-submit-btn">Guardar puntuación</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
